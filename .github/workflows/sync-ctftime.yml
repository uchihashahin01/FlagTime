name: Sync CTFtime data

on:
  schedule:
    # Every 3 hours. CTFtime's terms are generous for this volume.
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-ctftime.mjs'
      - '.github/workflows/sync-ctftime.yml'

permissions:
  contents: write

concurrency:
  group: sync-ctftime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch CTFtime snapshot
        run: node scripts/sync-ctftime.mjs

      - name: Commit updated snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ctftime
          if git diff --staged --quiet; then
            echo "No changes to the CTFtime snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh CTFtime snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
